name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        rust: ["1.75.0", stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --features aead -- -D warnings
      - run: cargo test
      - run: cargo test --features aead
      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --features aead
      - run: cargo run --example jpeg_over_uart
      - run: cargo run --example firmware_flash
      - run: cargo run --example sensor_telemetry
      - run: cargo run --example radio_windowed
      - run: cargo run --example forum
