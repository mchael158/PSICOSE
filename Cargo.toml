[package]
name = "psicose"
version = "0.4.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
description = "no_std heapless reliable link motor: 4-byte frame, ACK/CRC, window N≤8, P2P Node/PeerLink, LinkFace — zero crate dependencies"
readme = "README.md"
documentation = "https://docs.rs/psicose"
homepage = "https://github.com/mchael158/PSICOSE"
repository = "https://github.com/mchael158/PSICOSE"
keywords = ["no_std", "embedded", "protocol", "transport", "heapless"]
categories = ["embedded", "no-std", "network-programming"]
include = [
    "src/**",
    "tests/**",
    "Cargo.toml",
    "LICENSE-MIT",
    "LICENSE-APACHE",
    "README.md",
    "README.pt-BR.md",
    "SECURITY.md",
    "CONTRIBUTING.md",
    "docs/**",
    "CHANGELOG.md",
    "examples/**",
]
# `examples/common/link.rs` is a shared harness (`mod link`), not a demo.
autoexamples = false

[package.metadata.docs.rs]
rustdoc-args = [
    "--cfg",
    "docsrs",
    "--generate-link-to-definition",
]

[lib]
name = "psicose"
path = "src/lib.rs"

[[example]]
name = "jpeg_over_uart"
path = "examples/jpeg_over_uart.rs"

[[example]]
name = "firmware_flash"
path = "examples/firmware_flash.rs"

[[example]]
name = "sensor_telemetry"
path = "examples/sensor_telemetry.rs"

[[example]]
name = "radio_windowed"
path = "examples/radio_windowed.rs"

[[example]]
name = "ab_direct"
path = "examples/ab_direct.rs"

[[example]]
name = "p2p_pair"
path = "examples/p2p_pair.rs"

[[example]]
name = "tcp_pair"
path = "examples/tcp_pair.rs"

[dependencies]
# Intentionally empty. `use psicose::…` never pulls another crate.

# Host crate only (MSRV 1.75). Board packages live in `boards/` — their own
# workspace — so esp-hal / edition2024 do not break `cargo test` on 1.75.
[workspace]
resolver = "2"
members = ["."]
exclude = ["boards"]
