[package]
name = "psicose"
version = "0.2.3"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
description = "no_std, heapless reliable byte transport: 1-byte payload, 4-byte frame, stop-and-wait and windowed (N ≤ 8)."
readme = "README.md"
documentation = "https://docs.rs/psicose"
repository = "https://github.com/mchael158/PSICOSE"
keywords = ["no_std", "embedded", "protocol", "transport", "heapless"]
categories = ["embedded", "no-std", "network-programming"]
include = [
    "src/**",
    "tests/**",
    "Cargo.toml",
    "LICENSE-MIT",
    "LICENSE-APACHE",
    "README.md",
    "README.pt-BR.md",
    "PROTOCOL.md",
    "PROTOCOL.pt-BR.md",
    "CHANGELOG.md",
    "examples/**",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--generate-link-to-definition"]

[lib]
name = "psicose"
path = "src/lib.rs"

[features]
default = []

[dependencies]
# Intentionally empty. No allocator, no runtime, no async.
